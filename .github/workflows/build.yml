name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 固定使用 22.04 版本，避免迁移报错

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # 更新到 v5 版本

      - name: Set up JDK 17
        uses: actions/setup-java@v5  # 更新到 v5 版本
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
